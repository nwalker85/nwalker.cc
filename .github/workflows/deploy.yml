name: Deploy

# This site is a static export served from GitHub Pages. The deploy artifact is
# the compiled output of a commit — there is no origin, no container, no cloud
# provider, and no credential to rotate.
on:
  push:
    branches: [develop, main]
    tags: ['v*.*.*']
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # --------------------------------------------------------------------------
  # Verify — runs on every PR and every push. A build that cannot export never
  # reaches a branch, because export failures are architectural, not cosmetic.
  # --------------------------------------------------------------------------
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # tokens.css is committed, so the local token-forge dependency is not
      # required to build. Strip the file: link rather than pointing CI at a
      # path that only exists on a workstation.
      - name: Install dependencies
        run: |
          sed -i '/@nwalker\/token-forge/d' package.json
          pnpm install --no-frozen-lockfile --ignore-scripts

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test

      # Project /resume.pdf from nwalker85/resume. Do not run ReportLab.
      - name: Project résumé from nwalker85/resume
        run: |
          chmod +x scripts/project-resume.sh
          ./scripts/project-resume.sh

      - name: Static export
        run: pnpm build

      - name: Verify the export is a real site
        run: |
          test -f out/index.html || { echo "out/index.html missing"; exit 1; }
          test -f out/architecture/index.html || { echo "architecture route missing"; exit 1; }
          echo "exported $(find out -name '*.html' | wc -l) html files"
          du -sh out

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  # --------------------------------------------------------------------------
  # Deploy — publishes the verified artifact. Staging is a branch deploy of the
  # same output; production publishes from the release branch.
  # --------------------------------------------------------------------------
  deploy:
    needs: verify
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
