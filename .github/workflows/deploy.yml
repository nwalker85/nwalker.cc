name: Deploy Portfolio

on:
  push:
    branches: [develop]
    tags: ['v*.*.*']
  pull_request:
    branches: [develop, main]

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: portfolio-website
  ECS_CLUSTER: portfolio-cluster

jobs:
  # --------------------------------------------------------------------------
  # Validate on PRs and pushes
  # --------------------------------------------------------------------------
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies (strip local token-forge dep — tokens.css is committed)
        run: |
          sed -i '/@nwalker\/token-forge/d' package.json
          pnpm install --no-frozen-lockfile --ignore-scripts

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.3.0
        with:
          dockerfile: Dockerfile
          failure-threshold: warning

      - name: Terraform fmt
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.6
      - run: terraform fmt -check -recursive infra/

      - name: Terraform validate (staging)
        run: |
          cd infra/envs/staging
          terraform init -backend=false
          terraform validate

  # --------------------------------------------------------------------------
  # Build and push Docker image
  # --------------------------------------------------------------------------
  build:
    needs: validate
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v6

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6.1.1
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image tag
        id: meta
        env:
          SHA: ${{ github.sha }}
        run: echo "image_tag=${SHA::7}" >> "$GITHUB_OUTPUT"

      # Reuse the image if this commit was already built. A v* tag is normally
      # cut on a develop commit that staging already built and deployed, so the
      # :<sha> image exists. Rebuilding the same SHA is non-reproducible: it
      # produces a NEW digest and moves the mutable :<sha> tag onto it, orphaning
      # the digest the running ECS task pinned. ECR's "expire untagged after 7
      # days" rule then deletes that orphaned digest, and the service 503s on its
      # next task recycle (CannotPullContainerError). Skipping the rebuild both
      # prevents that and ships prod the exact artifact validated in staging.
      - name: Build and push (skip if image tag already exists)
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          TAG: ${{ steps.meta.outputs.image_tag }}
        run: |
          if aws ecr describe-images \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids imageTag="$TAG" \
            --region "$AWS_REGION" >/dev/null 2>&1; then
            echo "Image $ECR_REPOSITORY:$TAG already exists in ECR — reusing it, skipping rebuild."
            exit 0
          fi
          docker build \
            --platform linux/amd64 \
            --tag "$REGISTRY/$ECR_REPOSITORY:$TAG" \
            --tag "$REGISTRY/$ECR_REPOSITORY:latest" \
            .
          docker push "$REGISTRY/$ECR_REPOSITORY:$TAG"
          docker push "$REGISTRY/$ECR_REPOSITORY:latest"

  # --------------------------------------------------------------------------
  # Deploy to staging (on push to develop)
  # --------------------------------------------------------------------------
  deploy-staging:
    needs: build
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://staging.nwalker.cc
    steps:
      - uses: actions/checkout@v6

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6.1.1
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.6

      - name: Terraform Apply (staging)
        env:
          IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
        run: |
          cd infra/envs/staging
          terraform init
          terraform apply -auto-approve -var="image_tag=$IMAGE_TAG"

      - name: Deploy to ECS
        run: |
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service portfolio-staging \
            --force-new-deployment \
            --region "$AWS_REGION"
          aws ecs wait services-stable \
            --cluster "$ECS_CLUSTER" \
            --services portfolio-staging \
            --region "$AWS_REGION"

  # --------------------------------------------------------------------------
  # Deploy to production (on version tag, manual approval)
  # --------------------------------------------------------------------------
  deploy-production:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://nwalker.cc
    steps:
      - uses: actions/checkout@v6

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6.1.1
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.6

      - name: Terraform Apply (production)
        env:
          IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
        run: |
          cd infra/envs/production
          terraform init
          terraform apply -auto-approve -var="image_tag=$IMAGE_TAG"

      - name: Deploy to ECS
        run: |
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service portfolio-production \
            --force-new-deployment \
            --region "$AWS_REGION"
          aws ecs wait services-stable \
            --cluster "$ECS_CLUSTER" \
            --services portfolio-production \
            --region "$AWS_REGION"

  smoke-staging:
    needs: deploy-staging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Smoke test staging
        run: |
          set -o pipefail
          ./scripts/smoke.sh https://staging.nwalker.cc | tee -a "$GITHUB_STEP_SUMMARY"

  smoke-production:
    needs: deploy-production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Smoke test production
        run: |
          set -o pipefail
          ./scripts/smoke.sh https://nwalker.cc | tee -a "$GITHUB_STEP_SUMMARY"
